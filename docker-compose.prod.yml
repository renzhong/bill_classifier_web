services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      target: runtime
    image: bcw-backend:latest
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8080:8000"
    command: >
      sh -c "uv run alembic upgrade head &&
             uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
