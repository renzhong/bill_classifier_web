# 部署到宿主机 /etc/nginx/sites-enabled/ ，依赖 frontend dist 已 rsync 到 /opt/bill-classifier-web/frontend/dist
# 证书路径与 server_name 按实际域名替换

server {
    listen 80;
    server_name bcw.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bcw.example.com;

    ssl_certificate     /etc/nginx/ssl/bcw.example.com.pem;
    ssl_certificate_key /etc/nginx/ssl/bcw.example.com.key;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /opt/bill-classifier-web/frontend/dist;
    index index.html;

    client_max_body_size 20m;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /healthz {
        proxy_pass http://127.0.0.1:8080/healthz;
    }

    location ~* \.(?:js|css|woff2?|ttf|otf|eot|ico|png|jpe?g|gif|svg|webp)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
