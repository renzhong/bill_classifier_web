[project]
name = "bill-classifier-web-backend"
version = "0.1.0"
description = "Bill Classifier Web - 通用账单分类后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "asyncmy>=0.2.10",
    "pymysql>=1.1",
    "alembic>=1.14",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7.4",
    "cryptography>=43.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "chardet>=5.2",
    "openai>=1.55",
    "anthropic>=0.39",
    "google-generativeai>=0.8",
    "orjson>=3.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
