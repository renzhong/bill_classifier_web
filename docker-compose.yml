services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bill_classifier_web}
      MYSQL_USER: ${MYSQL_USER:-bcw}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-bcw_dev_password}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - ./docker/mysql/data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_dev_password}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      target: dev
    restart: unless-stopped
    env_file: .env
    environment:
      BCW_DB_HOST: mysql
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - backend_uv_cache:/root/.cache/uv
    command: >
      sh -c "uv run alembic upgrade head &&
             uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    image: node:22-bookworm-slim
    restart: unless-stopped
    working_dir: /app
    environment:
      VITE_API_BASE: /api/v1
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: >
      sh -c "npm install --no-audit --no-fund &&
             npm run dev -- --host 0.0.0.0 --port 5173"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    profiles: ["test"]
    depends_on:
      - backend
      - frontend
    ports:
      - "${NGINX_TEST_HOST_PORT:-8088}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/sites/bill-classifier.dev.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  backend_uv_cache:
  frontend_node_modules:
