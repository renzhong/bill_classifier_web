<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>财务页面交互原型 · Bill Classifier</title>
  <style>
    :root { color-scheme: light; --ink:#161616; --muted:#525252; --line:#e0e0e0; --paper:#fff; --bg:#f4f4f4; --brand:#a6c8ff; --brand-dark:#161616; --pale:#edf5ff; --warn:#161616; --warn-bg:#fff1f1; --nav:#fff; --red:#161616; font-family: -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); }
    button,input,select { font:inherit; }
    button { cursor:pointer; }
    .shell { display:grid; grid-template-columns:228px minmax(0,1fr); min-height:100vh; }
    aside { background:var(--nav); color:var(--ink); padding:28px 15px; position:sticky; top:0; height:100vh; border-right:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:12px; padding:0 12px 28px; border-bottom:1px solid var(--line); }
    .logo { width:39px; height:39px; border-radius:12px; display:grid; place-items:center; color:var(--ink); background:var(--brand); font-size:20px; font-weight:800; }
    .brand strong { display:block; font-size:16px; letter-spacing:.2px; }
    .brand small { color:var(--muted); font-size:11px; }
    .nav-title { padding:26px 15px 10px; color:var(--muted); font-size:11px; letter-spacing:2px; }
    .nav { display:grid; gap:6px; }
    .nav button { width:100%; border:0; border-radius:11px; background:transparent; color:var(--muted); text-align:left; padding:12px 15px; display:flex; gap:12px; align-items:center; font-weight:600; }
    .nav button:hover,.nav button.active { background:var(--pale); color:var(--ink); box-shadow:inset 3px 0 var(--brand); }
    .nav .num { width:22px; color:var(--muted); font-size:12px; }
    .aside-note { position:absolute; bottom:25px; left:27px; right:27px; color:var(--muted); font-size:12px; line-height:1.6; }
    main { min-width:0; }
    .topbar { height:67px; background:#fff; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; padding:0 34px; }
    .topbar span { color:var(--muted); font-size:13px; }
    .topbar .user { background:var(--pale); border-radius:99px; padding:8px 13px; color:var(--ink); font-weight:700; font-size:12px; }
    .content { max-width:1220px; margin:auto; padding:31px 34px 60px; }
    .eyebrow { color:var(--muted); font-size:12px; letter-spacing:2px; font-weight:800; margin-bottom:6px; }
    .heading { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:25px; }
    h1 { font-size:29px; margin:0 0 6px; letter-spacing:-.5px; }
    h2 { font-size:17px; margin:0; }
    h3 { font-size:15px; margin:0; }
    p { margin:0; }
    .sub { color:var(--muted); font-size:13px; line-height:1.6; }
    .actions { display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
    .btn { border:1px solid var(--line); border-radius:9px; background:#fff; color:var(--ink); padding:9px 14px; min-height:40px; font-weight:650; }
    .btn:hover { border-color:var(--ink); background:var(--pale); }
    .btn.primary { color:var(--ink); border-color:var(--brand); background:var(--brand); }
    .btn.primary:hover { background:#d0e2ff; }
    .btn.text { border-color:transparent; background:transparent; color:var(--ink); padding:5px 7px; text-decoration:underline; }
    .btn.small { padding:6px 10px; min-height:33px; font-size:12px; }
    .btn.danger { color:var(--red); }
    .month { display:flex; align-items:center; background:white; border:1px solid var(--line); border-radius:10px; height:40px; }
    .month button { border:0; background:transparent; width:38px; height:38px; color:var(--ink); font-size:18px; }
    .month button:hover { background:var(--pale); }
    .month input { border:0; width:105px; height:36px; color:var(--ink); text-align:center; font-weight:700; background:#fff; cursor:pointer; }
    .cards { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:15px; margin-bottom:19px; }
    .metric { border:1px solid var(--line); border-radius:16px; padding:19px 21px; background:var(--paper); min-height:125px; }
    .metric.focus { background:#d0e2ff; border:1px solid var(--brand); color:var(--ink); }
    .metric .label { font-size:13px; color:var(--muted); display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .metric.focus .label { color:var(--muted); }
    .metric .amount { font-variant-numeric:tabular-nums; font-size:27px; font-weight:800; margin-top:12px; letter-spacing:-.5px; white-space:nowrap; }
    .metric .foot { margin-top:9px; font-size:11px; color:var(--muted); }
    .metric.focus .foot { color:var(--muted); }
    .status { display:inline-block; border-radius:99px; padding:4px 8px; background:var(--pale); color:var(--brand-dark); font-size:11px; font-weight:750; white-space:nowrap; }
    .status.warn { background:var(--warn-bg); color:var(--warn); }
    .status.gray { background:#f4f4f4; color:var(--muted); }
    .section { background:#fff; border:1px solid var(--line); border-radius:16px; overflow:hidden; margin-top:16px; }
    .section-head { padding:19px 21px 14px; display:flex; justify-content:space-between; align-items:flex-start; gap:18px; }
    .section-head p { color:var(--muted); font-size:12px; margin-top:5px; }
    table { width:100%; border-collapse:collapse; }
    th { text-align:left; color:var(--muted); font-size:11px; letter-spacing:.4px; font-weight:700; padding:11px 21px; background:#f4f4f4; border-top:1px solid var(--line); }
    td { padding:13px 21px; border-top:1px solid var(--line); font-size:13px; }
    th.right,td.right { text-align:right; }
    .name { font-weight:720; }
    .subcell { color:var(--muted); font-size:11px; margin-top:3px; }
    .money { font-variant-numeric:tabular-nums; font-weight:760; white-space:nowrap; }
    .missing { color:var(--warn); font-weight:700; }
    .muted { color:var(--muted); }
    .hint { padding:11px 20px; background:#edf5ff; color:var(--muted); font-size:12px; border-top:1px solid var(--line); line-height:1.6; }
    .empty { padding:35px 21px; color:var(--muted); text-align:center; font-size:13px; }
    .flow { display:flex; gap:12px; margin-bottom:18px; }
    .step { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12px; font-weight:700; }
    .step b { display:grid; place-items:center; width:23px; height:23px; border-radius:99px; background:#d0e2ff; color:var(--ink); }
    .step.on b { background:var(--brand); color:var(--ink); }
    .upload-zone { border:1.5px dashed #a6c8ff; border-radius:16px; background:#edf5ff; padding:32px; text-align:center; }
    .upload-zone h2 { margin:0 0 8px; }
    .upload-zone p { color:var(--muted); font-size:13px; margin-bottom:18px; }
    .summary-line { display:flex; gap:9px; flex-wrap:wrap; align-items:center; }
    .pill { border:1px solid var(--line); border-radius:99px; background:#fff; padding:7px 11px; color:var(--muted); font-size:12px; }
    .pill strong { color:var(--ink); }
    .bar { height:8px; background:#edf5ff; border-radius:99px; overflow:hidden; min-width:110px; }
    .bar span { display:block; height:100%; background:#a6c8ff; border-radius:99px; }
    .invest-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:15px; }
    .invest-card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:19px 20px; }
    .invest-card .top { display:flex; align-items:center; justify-content:space-between; }
    .invest-card .value { font-size:24px; font-weight:800; margin:18px 0 14px; }
    .kv { display:flex; justify-content:space-between; gap:20px; padding:8px 0; border-top:1px solid var(--line); font-size:12px; }
    .kv span:first-child { color:var(--muted); }
    .positive { color:var(--ink); }
    .negative { color:var(--red); }
    dialog { border:1px solid var(--line); border-radius:18px; padding:0; width:min(460px,calc(100vw - 32px)); box-shadow:0 25px 80px #16161620; }
    dialog::backdrop { background:#16161666; }
    .dialog-content { padding:24px; }
    .dialog-content h2 { margin-bottom:6px; }
    .field { display:grid; gap:6px; margin-top:16px; font-size:12px; font-weight:720; }
    .field input,.field select { border:1px solid var(--line); border-radius:9px; height:43px; padding:0 12px; color:var(--ink); background:#fff; font-size:14px; width:100%; }
    .field input:focus,.field select:focus { outline:2px solid var(--brand); border-color:var(--brand); }
    .dialog-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:24px; }
    .toast { position:fixed; bottom:20px; right:24px; z-index:5; color:var(--ink); background:#edf5ff; border:1px solid #a6c8ff; padding:11px 16px; border-radius:10px; box-shadow:0 6px 30px #16161612; font-size:12px; opacity:0; transform:translateY(8px); pointer-events:none; transition:.2s; }
    .toast.show { opacity:1; transform:translateY(0); }
    .bottom-nav { display:none; }
    @media(max-width:950px) { .shell { grid-template-columns:185px minmax(0,1fr); } .cards { gap:9px; } .metric { padding:16px; } .metric .amount { font-size:21px; } th,td { padding-left:13px; padding-right:13px; } }
    @media(max-width:700px) { .shell { display:block; } aside { display:none; } .topbar { height:54px; padding:0 18px; } .content { padding:22px 15px 100px; } .heading { display:block; margin-bottom:17px; } .heading .actions { margin-top:15px; } h1 { font-size:24px; } .cards { grid-template-columns:1fr 1fr; } .metric.focus { grid-column:1/-1; } .metric { min-height:100px; } .metric .amount { font-size:22px; } .section { overflow-x:auto; } table { min-width:620px; } .invest-grid { grid-template-columns:1fr; } .bottom-nav { display:grid; grid-template-columns:repeat(5,1fr); position:fixed; bottom:0; left:0; right:0; z-index:4; background:#fff; border-top:1px solid var(--line); padding:6px 4px max(6px,env(safe-area-inset-bottom)); } .bottom-nav button { border:0; background:transparent; color:var(--muted); min-height:50px; font-size:11px; font-weight:700; border-radius:8px; } .bottom-nav button.active { color:var(--ink); background:var(--pale); } .bottom-nav button span { display:block; font-size:17px; margin-bottom:2px; } .toast { bottom:75px; left:15px; right:15px; } }
    @media(max-width:700px) { .asset-table,.investment-table { min-width:0; } .asset-table thead,.investment-table thead { display:none; } .asset-table tbody,.investment-table tbody { display:block; } .asset-table tr,.investment-table tr { display:grid; grid-template-columns:minmax(0,1fr) auto; padding:13px 15px; border-top:1px solid var(--line); gap:8px; } .asset-table td,.investment-table td { display:block; padding:0; border:0; } .asset-table td:first-child,.investment-table td:first-child { grid-column:1; grid-row:1; } .asset-table td:nth-child(2),.investment-table td:nth-child(2) { grid-column:2; grid-row:1; } .asset-table td:nth-child(3) { grid-column:1; grid-row:2; text-align:left; } .asset-table td:nth-child(3)::before { content:'上月 '; } .asset-table td:nth-child(4) { grid-column:2; grid-row:2; } .investment-table td:nth-child(3) { grid-column:2; grid-row:2; } }
  </style>
</head>
<body>
  <div class="shell">
    <aside>
      <div class="brand"><div class="logo">¥</div><div><strong>Bill Classifier</strong><small>你的财务工作台</small></div></div>
      <div class="nav-title">主要功能</div>
      <nav class="nav" id="sideNav" aria-label="主要功能"></nav>
      <div class="aside-note">交互设计原型<br>所有金额均为合成示例数据</div>
    </aside>
    <main><div class="topbar"><span>财务工作台 / 交互原型</span><span class="user">设计预览</span></div><div class="content" id="content"></div></main>
  </div>
  <nav class="bottom-nav" id="bottomNav" aria-label="移动端主要功能"></nav>
  <dialog id="editor"><form method="dialog" id="editorForm" class="dialog-content"></form></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    const menu = [
      { id:'bills', label:'账单', icon:'▤' }, { id:'categories', label:'分类花费', icon:'▥' },
      { id:'assets', label:'每月资产', icon:'◫' }, { id:'investments', label:'投资', icon:'↗' },
      { id:'incomes', label:'收入', icon:'＋' }
    ];
    const state = {
      page:'assets', month:'2026-09', nextId:20,
      assets:[
        {id:1,name:'工资卡',kind:'asset',amounts:{'2026-08':56200,'2026-09':58600}},
        {id:2,name:'微信',kind:'asset',amounts:{'2026-08':2940,'2026-09':3180}},
        {id:3,name:'支付宝',kind:'asset',amounts:{'2026-08':4200}},
        {id:4,name:'信用卡应还',kind:'liability',amounts:{'2026-08':4300,'2026-09':3860}}
      ],
      investments:[
        {id:10,name:'指数基金',principal:45000,months:{'2026-08':{buy:1000,sell:0,value:47800},'2026-09':{buy:2000,sell:500,value:50120}}},
        {id:11,name:'股票账户',principal:30000,months:{'2026-08':{buy:0,sell:0,value:32100}}}
      ],
      bills:[
        {id:1,date:'2026-09-23',name:'咖啡店',amount:38,category:'餐饮',tag:'zrz'},
        {id:2,date:'2026-09-21',name:'超市',amount:268.5,category:'日用',tag:'cwx'},
        {id:3,date:'2026-09-18',name:'餐厅',amount:156,category:'餐饮',tag:'zrz'},
        {id:4,date:'2026-09-12',name:'地铁',amount:6,category:'交通',tag:'zrz'},
        {id:5,date:'2026-08-12',name:'超市',amount:210,category:'日用',tag:'cwx'}
      ],
      incomes:[
        {id:1,date:'2026-09-20',amount:16800,source:'工资',note:''},
        {id:2,date:'2026-09-08',amount:2300,source:'兼职',note:'项目交付'},
        {id:3,date:'2026-08-20',amount:16500,source:'工资',note:''}
      ], filterCategory:null
    };
    const money = n => '¥' + Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const prevMonth = value => { const [y,m]=value.split('-').map(Number); return new Date(Date.UTC(y,m-2,1)).toISOString().slice(0,7); };
    const shiftMonth = (value,delta) => { const [y,m]=value.split('-').map(Number); return new Date(Date.UTC(y,m-1+delta,1)).toISOString().slice(0,7); };
    const monthLabel = value => { const [y,m]=value.split('-'); return `${y} 年 ${Number(m)} 月`; };
    const monthControl = () => `<div class="month" aria-label="选择月份"><button type="button" data-month-step="-1" aria-label="上个月">‹</button><input type="month" value="${state.month}" aria-label="月份" id="monthInput"><button type="button" data-month-step="1" aria-label="下个月">›</button></div>`;
    const heading = (eyebrow,title,sub,action='') => `<div class="heading"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p class="sub">${sub}</p></div><div class="actions">${monthControl()}${action}</div></div>`;
    function toast(message) { const el=document.getElementById('toast'); el.textContent=message; el.classList.add('show'); clearTimeout(toast.timer); toast.timer=setTimeout(()=>el.classList.remove('show'),2800); }
    function renderNav() {
      document.getElementById('sideNav').innerHTML=menu.map((x,i)=>`<button type="button" class="${x.id===state.page?'active':''}" data-page="${x.id}"><span class="num">0${i+1}</span>${x.label}</button>`).join('');
      document.getElementById('bottomNav').innerHTML=menu.map(x=>`<button type="button" class="${x.id===state.page?'active':''}" data-page="${x.id}"><span>${x.icon}</span>${x.label}</button>`).join('');
    }
    function renderAssets() {
      const items=state.assets.filter(x=>x.kind==='asset'), debts=state.assets.filter(x=>x.kind==='liability');
      const available=items.filter(x=>x.amounts[state.month]!==undefined);
      const availableDebt=debts.filter(x=>x.amounts[state.month]!==undefined);
      const invested=state.investments.filter(x=>x.months[state.month]?.value!==undefined);
      const totalAssets=available.reduce((n,x)=>n+x.amounts[state.month],0)+invested.reduce((n,x)=>n+x.months[state.month].value,0);
      const totalDebt=availableDebt.reduce((n,x)=>n+x.amounts[state.month],0);
      const missing=items.length-available.length+debts.length-availableDebt.length+state.investments.length-invested.length;
      const status=missing?`<span class="status warn">${missing} 项待填写</span>`:'<span class="status">已填完整</span>';
      const metric=(label,value,focused=false)=>`<div class="metric ${focused?'focus':''}"><div class="label">${label}${focused?status:''}</div><div class="amount">${money(value)}</div><div class="foot">${missing?'仅汇总已填写的金额':'本月数据已填完整'}</div></div>`;
      const row=x=>{ const val=x.amounts[state.month], prev=x.amounts[prevMonth(state.month)]; return `<tr><td><div class="name">${escapeHtml(x.name)}</div><div class="subcell">${x.kind==='liability'?'负债项':'手工资产项'}</div></td><td class="right">${val===undefined?'<span class="missing">待填写</span>':`<span class="money">${money(val)}</span>`}</td><td class="right muted">${prev===undefined?'—':money(prev)}</td><td class="right"><button type="button" class="btn small" data-edit-asset="${x.id}">${val===undefined?'填写金额':'修改'}</button></td></tr>`; };
      const table=(title,list,desc)=>`<section class="section"><div class="section-head"><div><h2>${title}</h2><p>${desc}</p></div></div>${list.length?`<table class="asset-table"><thead><tr><th>项目名称</th><th class="right">${monthLabel(state.month)}金额</th><th class="right">上月</th><th class="right">操作</th></tr></thead><tbody>${list.map(row).join('')}</tbody></table>`:`<div class="empty">还没有${title}。点击“新增资产项”开始。</div>`}</section>`;
      const investmentRows=state.investments.map(x=>{const val=x.months[state.month]?.value; return `<tr><td><div class="name">${escapeHtml(x.name)} <span class="status gray">来自投资页</span></div><div class="subcell">投资估值自动计入，不在此重复录入</div></td><td class="right">${val===undefined?'<span class="missing">待录入估值</span>':`<span class="money">${money(val)}</span>`}</td><td class="right"><button class="btn small" data-open-investment="${x.id}">去投资页</button></td></tr>`}).join('');
      return heading('MONTHLY ASSETS','每月资产汇总','资产项名称长期保留；切换月份后，只需填写各项当月金额。','<button class="btn primary" data-add-asset>＋ 新增资产项</button>')+
        `<div class="cards">${metric('净资产',totalAssets-totalDebt,true)}${metric('资产总额',totalAssets)}${metric('负债总额',totalDebt)}</div>`+
        table('我的资产项',items,'银行卡、微信、支付宝或任意自定义名称')+table('负债项',debts,'负债用正数填写，汇总时从资产中扣除')+
        `<section class="section"><div class="section-head"><div><h2>投资估值</h2><p>从投资页自动同步本月末现值，只读且仅计入一次</p></div></div><table class="investment-table"><thead><tr><th>投资项</th><th class="right">本月估值</th><th class="right">操作</th></tr></thead><tbody>${investmentRows}</tbody></table><div class="hint">${missing?'本月数据尚未填全；上方合计仅包含已有金额。未填写不等于 ¥0.00。':'所有启用项目均已填写本月金额。'}</div></section>`;
    }
    function renderBills() {
      return '<div class="heading"><div><div class="eyebrow">BILL WORKSPACE</div><h1>账单工作页第二版</h1><p class="sub">解析临时表格、手动触发分类、行内修改和归档月度查询。</p></div></div>' +
        '<section class="section"><div class="section-head"><div><h2>查看第二版账单交互原型</h2><p>旧版表格的筛选、行内下拉、多选与分页已纳入新设计。</p></div></div><div class="hint"><a href="ux-bills-v2.html">打开账单工作页第二版 →</a></div></section>';
    }
    function renderCategories() {
      const list=state.bills.filter(x=>x.date.startsWith(state.month)), grouped={};
      list.forEach(x=>{grouped[x.category]??={amount:0,count:0};grouped[x.category].amount+=x.amount;grouped[x.category].count++});
      const entries=Object.entries(grouped).sort((a,b)=>b[1].amount-a[1].amount), total=list.reduce((n,x)=>n+x.amount,0);
      return heading('MONTHLY SPENDING','每月分类花费','按类别看本月花了多少钱，点击类别即可查看对应账单。')+
        `<div class="cards"><div class="metric focus"><div class="label">${monthLabel(state.month)}支出</div><div class="amount">${money(total)}</div><div class="foot">${list.length} 笔计入统计的账单</div></div><div class="metric"><div class="label">支出类别</div><div class="amount">${entries.length}</div><div class="foot">按支出金额排序</div></div><div class="metric"><div class="label">最大支出类别</div><div class="amount" style="font-size:21px">${entries.length?escapeHtml(entries[0][0]):'—'}</div></div></div>`+
        `<section class="section"><div class="section-head"><div><h2>分类明细</h2><p>金额、占比和笔数来自相同的账单范围</p></div></div>${entries.length?`<table><thead><tr><th>类别</th><th>支出占比</th><th class="right">笔数</th><th class="right">金额</th><th class="right">明细</th></tr></thead><tbody>${entries.map(([name,data])=>`<tr><td class="name">${escapeHtml(name)}</td><td><div class="bar"><span style="width:${Math.round(data.amount/total*100)}%"></span></div><div class="subcell">${Math.round(data.amount/total*100)}%</div></td><td class="right">${data.count}</td><td class="right money">${money(data.amount)}</td><td class="right"><button class="btn small" data-category="${escapeHtml(name)}">查看账单</button></td></tr>`).join('')}</tbody></table>`:`<div class="empty">本月暂无计入统计的支出。<button class="btn text" data-page="bills">去上传账单</button></div>`}</section>`;
    }
    function renderInvestments() {
      const cards=state.investments.map(x=>{const current=x.months[state.month], previous=x.months[prevMonth(state.month)], first=Object.keys(x.months).sort()[0]===state.month, base=first?x.principal:previous?.value; const profit=current?.value!==undefined&&base!==undefined?current.value-base-(current.buy||0)+(current.sell||0):null; return `<article class="invest-card"><div class="top"><h2>${escapeHtml(x.name)}</h2><span class="status gray">投资项</span></div><div class="sub">初始本金 ${money(x.principal)}</div><div class="value">${current?.value===undefined?'<span class="missing">本月估值待录入</span>':money(current.value)}</div><div class="kv"><span>本月买入 / 卖出</span><strong>${money(current?.buy||0)} / ${money(current?.sell||0)}</strong></div><div class="kv"><span>当月盈亏</span><strong class="${profit===null?'missing':profit>=0?'positive':'negative'}">${profit===null?'待计算':`${profit>=0?'+':'−'}${money(Math.abs(profit))}`}</strong></div><button class="btn small" style="margin-top:15px" data-edit-investment="${x.id}">填写本月买卖与现值</button></article>`;}).join('');
      return heading('INVESTMENTS','投资','以投资项为单位记录本金、买卖与月末现值；现值自动汇入每月资产。','<button class="btn primary" data-add-investment>＋ 新增投资项</button>')+
        `<div class="invest-grid">${cards}</div><div class="hint" style="margin-top:17px;border:1px solid var(--line);border-radius:10px">当月盈亏 = 本月末现值 − 上月末现值 − 本月买入 + 本月卖出。首月以上述初始本金替代上月末现值；估值缺失时不显示零盈亏。</div>`;
    }
    function renderIncomes() {
      const list=state.incomes.filter(x=>x.date.startsWith(state.month)).sort((a,b)=>b.date.localeCompare(a.date));
      const year=state.month.slice(0,4), monthly=list.reduce((n,x)=>n+x.amount,0), yearly=state.incomes.filter(x=>x.date.startsWith(year)).reduce((n,x)=>n+x.amount,0);
      return heading('INCOME RECORDS','逐笔收入','记录每一笔收入的实际时间与金额，自动汇总月收入和年收入。','<button class="btn primary" data-add-income>＋ 记录收入</button>')+
        `<div class="cards"><div class="metric focus"><div class="label">${monthLabel(state.month)}收入</div><div class="amount">${money(monthly)}</div><div class="foot">${list.length} 笔逐笔收入</div></div><div class="metric"><div class="label">${year} 年收入</div><div class="amount">${money(yearly)}</div><div class="foot">按实际发生日期汇总</div></div></div>`+
        `<section class="section"><div class="section-head"><div><h2>收入明细</h2><p>同月同来源可以记录多笔</p></div></div>${list.length?`<table><thead><tr><th>发生时间</th><th>来源</th><th>备注</th><th class="right">金额</th></tr></thead><tbody>${list.map(x=>`<tr><td>${x.date}</td><td class="name">${escapeHtml(x.source||'未填写')}</td><td class="muted">${escapeHtml(x.note||'—')}</td><td class="right money">${money(x.amount)}</td></tr>`).join('')}</tbody></table>`:`<div class="empty">本月暂无收入记录。可新增一笔，或切换月份查看。</div>`}</section>`;
    }
    function render() { renderNav(); document.getElementById('content').innerHTML=({bills:renderBills,categories:renderCategories,assets:renderAssets,investments:renderInvestments,incomes:renderIncomes})[state.page](); }
    function openDialog(title,subtitle,fields,onSave) {
      const dialog=document.getElementById('editor'), form=document.getElementById('editorForm');
      form.innerHTML=`<h2>${title}</h2><p class="sub">${subtitle}</p>${fields}<div class="dialog-actions"><button type="button" class="btn" id="cancelEditor">取消</button><button type="submit" class="btn primary">保存</button></div>`;
      document.getElementById('cancelEditor').onclick=()=>dialog.close();
      form.onsubmit=e=>{e.preventDefault(); const data=new FormData(form); if(onSave(data)!==false){dialog.close();render();}};
      dialog.showModal();
    }
    const input=(label,name,value='',type='text',required=true)=>`<label class="field">${label}<input name="${name}" type="${type}" value="${escapeHtml(value)}" ${required?'required':''} ${type==='number'?'min="0" step="0.01"':''}></label>`;
    function editAsset(id) { const item=state.assets.find(x=>x.id===id); openDialog('填写月度金额',`${item.name} · ${monthLabel(state.month)}。项目名称会在其他月份保留。`,input('金额（元）','amount',item.amounts[state.month]??'', 'number'),data=>{const n=Number(data.get('amount'));if(!Number.isFinite(n)||n<0){toast('请输入非负金额');return false;}item.amounts[state.month]=n;toast('月度金额已保存');}); }
    function addAsset() { openDialog('新增资产项','只创建一次项目名称；以后每月直接填写金额。',input('项目名称','name')+`<label class="field">性质<select name="kind"><option value="asset">资产项</option><option value="liability">负债项</option></select></label>`+input('本月金额（可稍后填写）','amount','','number',false),data=>{const name=String(data.get('name')||'').trim(),raw=String(data.get('amount')||'');if(!name){toast('请填写项目名称');return false;}const item={id:state.nextId++,name,kind:data.get('kind'),amounts:{}};if(raw!=='')item.amounts[state.month]=Number(raw);state.assets.push(item);toast('资产项已创建，后续月份会自动列出');}); }
    function editInvestment(id) {const item=state.investments.find(x=>x.id===id), v=item.months[state.month]||{};openDialog('填写投资月度数据',`${item.name} · ${monthLabel(state.month)}。保存后，现值自动计入资产汇总。`,input('本月买入（元）','buy',v.buy??0,'number')+input('本月卖出（元）','sell',v.sell??0,'number')+input('本月末现值（元）','value',v.value??'','number'),data=>{item.months[state.month]={buy:Number(data.get('buy')),sell:Number(data.get('sell')),value:Number(data.get('value'))};toast('投资估值已同步到每月资产');}); }
    function addInvestment(){openDialog('新增投资项','本金在创建时填写；之后按月记录买卖和现值。',input('投资项名称','name')+input('初始本金（元）','principal','','number'),data=>{const name=String(data.get('name')||'').trim();if(!name)return false;state.investments.push({id:state.nextId++,name,principal:Number(data.get('principal')),months:{}});toast('投资项已创建');});}
    function addIncome(){openDialog('记录收入','同月同来源可记录多笔。',input('发生日期','date',`${state.month}-20`,'date')+input('金额（元）','amount','','number')+input('来源（可选）','source','','text',false)+input('备注（可选）','note','','text',false),data=>{state.incomes.push({id:state.nextId++,date:String(data.get('date')),amount:Number(data.get('amount')),source:String(data.get('source')||''),note:String(data.get('note')||'')});toast('收入已记录');});}
    document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.page){if(d.page==='bills'){location.href='ux-bills-v2.html';return;}state.page=d.page;state.filterCategory=null;render();window.scrollTo(0,0)}else if(d.monthStep){state.month=shiftMonth(state.month,Number(d.monthStep));render()}else if(d.addAsset!==undefined)addAsset();else if(d.editAsset)editAsset(Number(d.editAsset));else if(d.openInvestment){state.page='investments';render();window.scrollTo(0,0)}else if(d.editInvestment)editInvestment(Number(d.editInvestment));else if(d.addInvestment!==undefined)addInvestment();else if(d.addIncome!==undefined)addIncome();else if(d.category){location.href='ux-bills-v2.html?month='+encodeURIComponent(state.month)+'&category='+encodeURIComponent(d.category)}else if(d.clearCategory!==undefined){state.filterCategory=null;render()}else if(d.demoUpload!==undefined)toast('这是静态原型，上传流程仅作布局演示');});
    document.addEventListener('change',e=>{if(e.target.id==='monthInput'&&/^\d{4}-\d{2}$/.test(e.target.value)){state.month=e.target.value;render();}});
    render();
  </script>
</body>
</html>
