name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: bcw_test
          MYSQL_USER: bcw
          MYSQL_PASSWORD: bcw_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_password"
          --health-interval=5s --health-timeout=3s --health-retries=30
    env:
      BCW_TEST_MYSQL: '1'
      BCW_DB_HOST: 127.0.0.1
      BCW_DB_PORT: '3306'
      BCW_DB_NAME: bcw_test
      BCW_DB_USER: bcw
      BCW_DB_PASSWORD: bcw_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.18'
      - run: uv sync --frozen
      - run: uv run --frozen ruff check app tests devdata ../scripts/testdata.py
      - run: uv run --frozen alembic upgrade head
      - run: uv run --frozen python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
